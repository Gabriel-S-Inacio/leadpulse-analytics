[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#0B1020"
secondaryBackgroundColor = "#111827"
textColor = "#F8FAFC"
font = "sans-serif"

[server]
address = "0.0.0.0"
headless = true
runOnSave = false
fileWatcherType = "none"
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false
