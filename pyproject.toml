[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadpulse-analytics"
version = "0.1.0"
description = "Analytics foundation for integrated marketing and CRM data."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "psycopg[binary]>=3.3,<4",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "pandas-stubs>=2.3,<4",
  "pytest>=8,<10",
  "ruff>=0.13,<1",
]
data = [
  "dbt-postgres>=1.11,<2",
]
dashboard = [
  "pandas>=2.3,<4",
  "plotly>=6.3,<7",
  "streamlit>=1.50,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["leadpulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
