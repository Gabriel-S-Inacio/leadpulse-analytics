version: 2

sources:
  - name: olist_raw
    description: Source-shaped Olist snapshots loaded by LeadPulse ingestion.
    schema: raw
    tables:
      - name: olist_marketing_qualified_leads
        description: Historical static Kaggle MQL snapshot; no source freshness SLA applies.
      - name: olist_closed_deals
        description: Historical static Kaggle Closed Deals snapshot; no source freshness SLA applies.
      - name: olist_sellers
        description: Historical static Kaggle seller master snapshot; no source freshness SLA applies.
      - name: olist_orders
        description: Historical static Kaggle order snapshot; no source freshness SLA applies.
      - name: olist_order_items
        description: Historical static Kaggle order-item snapshot; no source freshness SLA applies.

  - name: synthetic_raw
    description: Deterministic LeadPulse-owned synthetic inputs, never observed Olist data.
    schema: raw
    tables:
      - name: synthetic_marketing_spend
        description: Reproducible non-causal paid-media scenario; no freshness SLA applies.
