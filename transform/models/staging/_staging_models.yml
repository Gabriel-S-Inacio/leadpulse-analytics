version: 2

models:
  - name: stg_olist_marketing_qualified_leads
    description: Typed and consistently named MQL source records without business channel mapping.
    columns:
      - name: mql_id
        description: Source MQL identifier.
        data_tests:
          - not_null
          - unique
      - name: first_contact_date
        description: Source first-contact date converted from raw text to DATE.
      - name: landing_page_id
        description: Source landing-page identifier; not a Campaign.
      - name: source_origin
        description: Raw acquisition origin preserved without Channel normalization.
  - name: stg_olist_closed_deals
    description: Technically normalized Closed Deals records without dimensional enrichment.
    columns:
      - name: mql_id
        description: Source MQL identifier for the observed funnel relationship.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_olist_marketing_qualified_leads')
                field: mql_id
      - name: seller_id
        description: Source seller identifier; observed as one-to-one in this snapshot.
        data_tests:
          - not_null
          - unique
      - name: won_date
        description: Source won timestamp converted from raw text to TIMESTAMP.
  - name: stg_olist_sellers
    description: Technically normalized seller master records without dimensional enrichment.
    columns:
      - name: seller_id
        description: Source seller identifier.
        data_tests:
          - not_null
          - unique
  - name: stg_olist_orders
    description: Technically normalized order records without eligibility filtering.
    columns:
      - name: order_id
        description: Source order identifier.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Source customer identifier retained for order-level traceability.
        data_tests:
          - not_null
      - name: order_status
        description: Raw order status retained without business filtering.
        data_tests:
          - not_null
  - name: stg_olist_order_items
    description: Typed order-item records at source (order_id, order_item_id) grain.
    columns:
      - name: order_id
        description: Source order identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist_orders')
                field: order_id
      - name: order_item_id
        description: Source item sequence within an order.
        data_tests:
          - not_null
      - name: seller_id
        description: Source seller responsible for the order item.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist_sellers')
                field: seller_id
      - name: price
        description: Source item price converted to NUMERIC; no GMV eligibility is applied.
        data_tests:
          - not_null
      - name: freight_value
        description: Source freight converted to NUMERIC and kept separate from price.
        data_tests:
          - not_null

  - name: stg_synthetic_marketing_spend
    description: Typed deterministic synthetic paid-media scenario with no business outcomes.
    columns:
      - name: spend_date
        data_tests:
          - not_null
      - name: source_origin
        data_tests:
          - not_null
      - name: scenario_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['baseline_v1']
      - name: methodology_version
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['paid_media_daily_v1']
      - name: generation_seed
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [20260913]
      - name: currency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BRL']
      - name: spend_amount
        data_tests:
          - not_null
      - name: data_classification
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SYNTHETIC']
